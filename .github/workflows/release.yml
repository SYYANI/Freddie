name: Build Unsigned DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-dmg:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      APP_NAME: Freddie
      PROJECT_PATH: ReadPaper.xcodeproj
      SCHEME: ReadPaper
      DERIVED_DATA_PATH: build/DerivedData
      APP_PATH: build/DerivedData/Build/Products/Release/Freddie.app
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      BABELDOC_ROOT: build/DerivedData/SourcePackages/checkouts/BabelDOC
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure private Swift package access
        env:
          READPAPER_PACKAGES_TOKEN: ${{ secrets.READPAPER_PACKAGES_TOKEN }}
        run: |
          if [ -z "$READPAPER_PACKAGES_TOKEN" ]; then
            echo "::error::Set the READPAPER_PACKAGES_TOKEN Actions secret with read access to the four SYYANI Swift package repositories."
            exit 1
          fi
          git config --global credential.https://github.com.useHttpPath true
          git config --global --add credential.https://github.com.helper ""
          git config --global --add credential.https://github.com.helper "$GITHUB_WORKSPACE/scripts/git-credential-private-packages"

      - name: Check Environment Versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Install build tools
        run: |
          brew install xcodegen create-dmg uv

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Resolve remote package dependencies
        env:
          READPAPER_PACKAGES_TOKEN: ${{ secrets.READPAPER_PACKAGES_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA_PATH"

      - name: Prepare and verify native runtime assets
        run: |
          ./scripts/prepare-generated-babeldoc-model "$BABELDOC_ROOT"
          python3 "$BABELDOC_ROOT/tools/download_runtime_fonts.py"
          # Keep the same Vendor directory while deferring BabelDOC's in-place
          # manifest write to the atomic refresh step below.
          BABELDOC_VENDOR_ROOT="$BABELDOC_ROOT/Vendor/." \
            "$BABELDOC_ROOT/tools/build_native_libraries.sh" zstd
          python3 "$BABELDOC_ROOT/tools/verify_mupdf_vendor.py"
          python3 "$BABELDOC_ROOT/tools/verify_model_vendor.py"
          python3 "$BABELDOC_ROOT/tools/verify_local_runtime_assets.py"
          ./scripts/refresh-babeldoc-runtime-manifest "$BABELDOC_ROOT"

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify app bundle
        run: |
          test -d "$APP_PATH"
          python3 "$BABELDOC_ROOT/tools/verify_native_runtime.py" \
            --root "$APP_PATH/Contents/Resources/BabelDOCNative" \
            --manifest "$BABELDOC_ROOT/Sources/BabelDocKit/Resources/runtime-manifest.json"
          codesign --verify --strict --verbose=2 \
            "$APP_PATH/Contents/Helpers/babeldoc-readpaper-helper"

      - name: Resolve artifact names
        id: artifact_meta
        run: |
          app_info_plist="$APP_PATH/Contents/Info.plist"
          app_version="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_info_plist"
          )"
          app_build="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_info_plist"
          )"
          dmg_basename="${APP_NAME}-${app_version}-unsigned"
          dmg_path="build/${dmg_basename}.dmg"
          artifact_name="${dmg_basename}-dmg"

          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "APP_BUILD=$app_build" >> "$GITHUB_ENV"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "app_build=$app_build" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Record build provenance
        run: |
          runtime_manifest="$BABELDOC_ROOT/Sources/BabelDocKit/Resources/runtime-manifest.json"
          {
            echo "read-paper=$GITHUB_SHA"
            for package in swift-readability BabelDOC arxivLatex SwiftStreamingMarkdown; do
              echo "$package=$(git -C "$DERIVED_DATA_PATH/SourcePackages/checkouts/$package" rev-parse HEAD)"
            done
            echo "layout-model-sha256=$(shasum -a 256 "$BABELDOC_ROOT/Vendor/Models/doclayout_yolo_docstructbench_imgsz1024.mlmodel" | awk '{print $1}')"
            echo "runtime-manifest-sha256=$(shasum -a 256 "$runtime_manifest" | awk '{print $1}')"
            echo "app-version=$APP_VERSION"
            echo "app-build=$APP_BUILD"
            xcodebuild -version
          } > build/build-provenance.txt

      - name: Create DMG
        run: |
          rm -f "$DMG_PATH"
          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 200 190 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 600 185 \
            "$DMG_PATH" \
            "$APP_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact_meta.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            ${{ steps.artifact_meta.outputs.dmg_path }}
            build/build-provenance.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: |
            ${{ steps.artifact_meta.outputs.dmg_path }}
            build/build-provenance.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
