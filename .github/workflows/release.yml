name: Build Unsigned DMG

on:
  workflow_dispatch:
    inputs:
      babeldoc_ref:
        description: Full 40-character reWriteBabelDoc commit (falls back to BABELDOC_REF repository variable)
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-dmg:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      APP_NAME: Freddie
      PROJECT_PATH: ReadPaper.xcodeproj
      SCHEME: ReadPaper
      DERIVED_DATA_PATH: build/DerivedData
      APP_PATH: build/DerivedData/Build/Products/Release/Freddie.app
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      LOCAL_READABILITY_REPO: https://github.com/SYYANI/swift-readability.git
      LOCAL_READABILITY_REF: 5fabfd7dbb75c3a26cf459d6bc5a3b6897a319f4
      LOCAL_BABELDOC_REPO: https://github.com/SYYANI/BabelDOC.git
      LOCAL_BABELDOC_REF: ${{ inputs.babeldoc_ref || vars.BABELDOC_REF }}
      LOCAL_STREAMING_MARKDOWN_REPO: https://github.com/SYYANI/SwiftStreamingMarkdown.git
      LOCAL_STREAMING_MARKDOWN_REF: 03549cb3256a7db99571c8bf0bd236420071e66e
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Environment Versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Validate dependency pins
        run: |
          if [[ ! "$LOCAL_READABILITY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "LOCAL_READABILITY_REF must be a full Git commit." >&2
            exit 2
          fi
          if [[ ! "$LOCAL_BABELDOC_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Provide a full reWriteBabelDoc commit through workflow input babeldoc_ref or repository variable BABELDOC_REF." >&2
            exit 2
          fi
          if [[ ! "$LOCAL_STREAMING_MARKDOWN_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "LOCAL_STREAMING_MARKDOWN_REF must be a full Git commit." >&2
            exit 2
          fi

      - name: Restore local package dependencies
        run: |
          if [ -e swift-readability ]; then
            echo "Unexpected pre-existing local path: swift-readability" >&2
            exit 2
          fi
          git init swift-readability
          git -C swift-readability remote add origin "$LOCAL_READABILITY_REPO"
          git -C swift-readability fetch --depth 1 origin "$LOCAL_READABILITY_REF"
          git -C swift-readability checkout --detach FETCH_HEAD
          actual_readability_ref="$(git -C swift-readability rev-parse HEAD)"
          if [ "$actual_readability_ref" != "$LOCAL_READABILITY_REF" ]; then
            echo "swift-readability checkout mismatch: expected $LOCAL_READABILITY_REF, got $actual_readability_ref" >&2
            exit 1
          fi

          if [ -e ../reWriteBabelDoc ]; then
            echo "Unexpected pre-existing sibling path: ../reWriteBabelDoc" >&2
            exit 2
          fi
          git init ../reWriteBabelDoc
          git -C ../reWriteBabelDoc remote add origin "$LOCAL_BABELDOC_REPO"
          git -C ../reWriteBabelDoc fetch --depth 1 origin "$LOCAL_BABELDOC_REF"
          git -C ../reWriteBabelDoc checkout --detach FETCH_HEAD
          actual_babeldoc_ref="$(git -C ../reWriteBabelDoc rev-parse HEAD)"
          if [ "$actual_babeldoc_ref" != "$LOCAL_BABELDOC_REF" ]; then
            echo "reWriteBabelDoc checkout mismatch: expected $LOCAL_BABELDOC_REF, got $actual_babeldoc_ref" >&2
            exit 1
          fi

          if [ -e ../SwiftStreamingMarkdown ]; then
            echo "Unexpected pre-existing sibling path: ../SwiftStreamingMarkdown" >&2
            exit 2
          fi
          git init ../SwiftStreamingMarkdown
          git -C ../SwiftStreamingMarkdown remote add origin "$LOCAL_STREAMING_MARKDOWN_REPO"
          git -C ../SwiftStreamingMarkdown fetch --depth 1 origin "$LOCAL_STREAMING_MARKDOWN_REF"
          git -C ../SwiftStreamingMarkdown checkout --detach FETCH_HEAD
          actual_streaming_markdown_ref="$(git -C ../SwiftStreamingMarkdown rev-parse HEAD)"
          if [ "$actual_streaming_markdown_ref" != "$LOCAL_STREAMING_MARKDOWN_REF" ]; then
            echo "SwiftStreamingMarkdown checkout mismatch: expected $LOCAL_STREAMING_MARKDOWN_REF, got $actual_streaming_markdown_ref" >&2
            exit 1
          fi

      - name: Prepare and verify native runtime assets
        run: |
          ../reWriteBabelDoc/tools/download_native_assets.sh models
          python3 ../reWriteBabelDoc/tools/download_runtime_fonts.py
          ../reWriteBabelDoc/tools/build_native_libraries.sh zstd
          python3 ../reWriteBabelDoc/tools/verify_mupdf_vendor.py
          python3 ../reWriteBabelDoc/tools/verify_model_vendor.py
          python3 ../reWriteBabelDoc/tools/verify_local_runtime_assets.py
          python3 ../reWriteBabelDoc/tools/generate_native_runtime_manifest.py --check

      - name: Install build tools
        run: |
          brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify app bundle
        run: |
          test -d "$APP_PATH"
          python3 ../reWriteBabelDoc/tools/verify_native_runtime.py \
            --root "$APP_PATH/Contents/Resources/BabelDOCNative" \
            --manifest ../reWriteBabelDoc/Sources/BabelDocKit/Resources/runtime-manifest.json
          codesign --verify --strict --verbose=2 \
            "$APP_PATH/Contents/Helpers/babeldoc-readpaper-helper"

      - name: Resolve artifact names
        id: artifact_meta
        run: |
          app_info_plist="$APP_PATH/Contents/Info.plist"
          app_version="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_info_plist"
          )"
          app_build="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_info_plist"
          )"
          dmg_basename="${APP_NAME}-${app_version}-unsigned"
          dmg_path="build/${dmg_basename}.dmg"
          artifact_name="${dmg_basename}-dmg"

          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "APP_BUILD=$app_build" >> "$GITHUB_ENV"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "app_build=$app_build" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Record build provenance
        run: |
          runtime_manifest=../reWriteBabelDoc/Sources/BabelDocKit/Resources/runtime-manifest.json
          {
            echo "read-paper=$GITHUB_SHA"
            echo "swift-readability=$LOCAL_READABILITY_REF"
            echo "reWriteBabelDoc=$LOCAL_BABELDOC_REF"
            echo "SwiftStreamingMarkdown=$LOCAL_STREAMING_MARKDOWN_REF"
            echo "runtime-manifest-sha256=$(shasum -a 256 "$runtime_manifest" | awk '{print $1}')"
            echo "app-version=$APP_VERSION"
            echo "app-build=$APP_BUILD"
            xcodebuild -version
          } > build/build-provenance.txt

      - name: Create DMG
        run: |
          rm -f "$DMG_PATH"
          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 200 190 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 600 185 \
            "$DMG_PATH" \
            "$APP_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact_meta.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            ${{ steps.artifact_meta.outputs.dmg_path }}
            build/build-provenance.txt
